name: Deploy

run-name: Deploy test-envs to ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }} by @${{ github.actor }}

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - stg
          - prod

jobs:
  set-lifecycle:
    name: Set Lifecycle for Deployment
    runs-on: ubuntu-latest
    outputs:
      lifecycle: ${{ steps.set-variable.outputs.lifecycle }}
    steps:
      - name: Set Variable
        id: set-variable
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LIFECYCLE="${{ inputs.environment }}"
          else
            LIFECYCLE="dev"
          fi

          echo "setting lifecycle to $LIFECYCLE"
          echo "lifecycle=$LIFECYCLE" >> "$GITHUB_OUTPUT"

      - name: Validate ref is release/* or hotfix/*
        if: steps.set-variable.outputs.lifecycle == 'stg' || steps.set-variable.outputs.lifecycle == 'prod'
        run: |
          case "${{ github.ref_name }}" in
            release/*|hotfix/*)
              echo "Branch ${{ github.ref_name }} is allowed for ${{ steps.set-variable.outputs.lifecycle }} deploy"
              ;;
            *)
              echo "::error::${{ steps.set-variable.outputs.lifecycle }} deploys only allowed from release/* or hotfix/* branches (current: ${{ github.ref_name }})"
              exit 1
              ;;
          esac

      - name: Checkout code
        if: steps.set-variable.outputs.lifecycle == 'stg' || steps.set-variable.outputs.lifecycle == 'prod'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit was deployed to stg first
        if: steps.set-variable.outputs.lifecycle == 'prod'
        run: |
          git fetch origin refs/tags/stg:refs/tags/stg || true

          if ! git rev-parse refs/tags/stg^{commit} >/dev/null 2>&1; then
            echo "::error::No stg tag found. Deploy this commit to stg first."
            exit 1
          fi

          STG_SHA=$(git rev-parse refs/tags/stg^{commit})
          if [ "$STG_SHA" != "${{ github.sha }}" ]; then
            echo "::error::stg tag points to ${STG_SHA} but this prod deploy is ${{ github.sha }}. Deploy this commit to stg first."
            exit 1
          fi

          echo "stg tag confirms ${{ github.sha }} was deployed to staging"

  deploy:
    name: Deploy test-envs
    needs: set-lifecycle
    permissions:
      contents: write
    uses: ./.github/workflows/_deploy_app.yml
    with:
      appName: test-envs
      lifecycle: ${{ needs.set-lifecycle.outputs.lifecycle }}
